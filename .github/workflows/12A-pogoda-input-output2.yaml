name: 12A - Pogoda - inputs i outputs

on:
  workflow_dispatch:
    inputs:
      first_name:
        description: "Imię bez polskich znaków, np. Jan"
        type: string
        required: true

      last_name:
        description: "Nazwisko bez polskich znaków, np. Kowalski"
        type: string
        required: true

      deployment_target:
        description: "Runner dla wdrożenia"
        type: choice
        required: true
        default: github
        options:
          - github
          - self-hosted

      city:
        description: "Miasto do sprawdzenia pogody"
        type: string
        required: true
        default: Warsaw

      app_port:
        description: "Port aplikacji od 1024 do 65535"
        type: number
        required: true
        default: 18800

jobs:
  # 1. Walidacja danych i przygotowanie konfiguracji
  prepare:
    name: Przygotuj konfigurację
    runs-on: ubuntu-latest

    outputs:
      student_slug: ${{ steps.config.outputs.student_slug }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      sha_tag: ${{ steps.config.outputs.sha_tag }}
      container_name: ${{ steps.config.outputs.container_name }}
      runner_labels: ${{ steps.config.outputs.runner_labels }}
      app_port: ${{ steps.config.outputs.app_port }}
      weather_city: ${{ steps.config.outputs.weather_city }}
      ci_image: ${{ steps.config.outputs.ci_image }}
      deployment_target: ${{ steps.config.outputs.deployment_target }}

    steps:
      - name: Waliduj dane i przygotuj outputs
        id: config
        env:
          FIRST_NAME: ${{ inputs.first_name }}
          LAST_NAME: ${{ inputs.last_name }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          CITY: ${{ inputs.city }}
          APP_PORT: ${{ inputs.app_port }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import unicodedata

          first_name = os.environ["FIRST_NAME"]
          last_name = os.environ["LAST_NAME"]
          target = os.environ["DEPLOYMENT_TARGET"]
          city = os.environ["CITY"]
          port = os.environ["APP_PORT"]

          errors = []
          name_pattern = re.compile(r"[A-Za-z]+(?:-[A-Za-z]+)*")

          for label, value in (
              ("first_name", first_name),
              ("last_name", last_name),
          ):
              if not 1 <= len(value) <= 30 or not name_pattern.fullmatch(value):
                  errors.append(
                      f"{label}: wymagane 1–30 liter ASCII; "
                      "człony mogą być rozdzielone myślnikami."
                  )

          if target not in ("github", "self-hosted"):
              errors.append(
                  "deployment_target: wybierz github albo self-hosted."
              )

          if not city.strip() or len(city) > 100:
              errors.append(
                  "city: miasto musi być niepuste i mieć maksymalnie 100 znaków."
              )

          if any(unicodedata.category(char) == "Cc" for char in city):
              errors.append("city: znaki sterujące nie są dozwolone.")

          if not re.fullmatch(r"[0-9]+", port) or len(port) > 5:
              errors.append("app_port: wymagana liczba całkowita.")
          elif not 1024 <= int(port) <= 65535:
              errors.append("app_port: dozwolony zakres to 1024–65535.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          slug = f"{first_name.lower()}-{last_name.lower()}"
          sha = os.environ["GITHUB_SHA"]
          repo_id = os.environ["GITHUB_REPOSITORY_ID"]
          run_id = os.environ["GITHUB_RUN_ID"]

          if target == "self-hosted":
              runner_labels = ["self-hosted", "linux"]
              container_name = f"cw12a-{repo_id}-{slug}-prod"
          else:
              runner_labels = ["ubuntu-latest"]
              container_name = f"cw12a-{repo_id}-{slug}-{run_id}"

          outputs = {
              "student_slug": slug,
              "image_tag": f"{slug}-{sha}",
              "sha_tag": sha,
              "container_name": container_name,
              "runner_labels": json.dumps(
                  runner_labels,
                  separators=(",", ":"),
              ),
              "app_port": str(int(port)),
              "weather_city": city,
              "ci_image": f"cw12a-weather:ci-{sha}",
              "deployment_target": target,
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output_file:
              for key, value in outputs.items():
                  output_file.write(f"{key}={value}\n")

          print(f"Przygotowano konfigurację dla: {slug}")
          print(f"Cel wdrożenia: {target}")
          PY

  # 2. Jednorazowe zbudowanie obrazu i zapis do artefaktu
  build:
    name: Zbuduj obraz
    needs: [prepare]
    runs-on: ubuntu-latest

    outputs:
      image_id: ${{ steps.image.outputs.image_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zbuduj obraz
        id: image
        env:
          CI_IMAGE: ${{ needs.prepare.outputs.ci_image }}
        run: |
          set -euo pipefail

          docker build \
            -t "$CI_IMAGE" \
            ./CWICZENIA/12A-Cwiczenia-pipeline-gha/pogoda_python_flusk

          IMAGE_ID="$(docker image inspect "$CI_IMAGE" --format '{{.Id}}')"

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

          docker save --output image.tar "$CI_IMAGE"

      - name: Zapisz obraz jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: cw12a-weather-image
          path: image.tar
          retention-days: 1
          overwrite: true

  # 3. Test dokładnie tego obrazu, który został zbudowany
  test:
    name: Przetestuj obraz i API
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pobierz obraz
        uses: actions/download-artifact@v4
        with:
          name: cw12a-weather-image

      - name: Załaduj i sprawdź obraz
        env:
          CI_IMAGE: ${{ needs.prepare.outputs.ci_image }}
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail

          docker load --input image.tar

          LOADED_IMAGE_ID="$(docker image inspect "$CI_IMAGE" --format '{{.Id}}')"

          if [[ "$LOADED_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "Błąd: ID załadowanego obrazu różni się od obrazu z build."
            exit 1
          fi

          echo "ID obrazu jest zgodne z wynikiem build."

      - name: Uruchom kontener testowy
        env:
          CI_IMAGE: ${{ needs.prepare.outputs.ci_image }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$OPENWEATHER_API_KEY" ]]; then
            echo "::error::Brak sekretu OPENWEATHER_API_KEY."
            exit 1
          fi

          docker run -d \
            --name cw12a-ci \
            -p 127.0.0.1:18080:8080 \
            -e OPENWEATHER_API_KEY \
            "$CI_IMAGE"

      - name: Poczekaj na gotowość API
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/healthz > /dev/null; then
              echo "Aplikacja jest gotowa."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Aplikacja nie uruchomiła się na czas."
          exit 1

      - name: Sprawdź WWW i rzeczywiste API pogodowe
        env:
          CITY: ${{ needs.prepare.outputs.weather_city }}
        run: |
          set -euo pipefail

          python3 \
            CWICZENIA/12A-Cwiczenia-pipeline-gha/pogoda_python_flusk/tests/smoke_test.py \
            --base-url "http://127.0.0.1:18080" \
            --city "$CITY"

      - name: Pokaż logi przy błędzie
        if: failure()
        run: |
          docker logs cw12a-ci || true

      - name: Usuń kontener testowy
        if: always()
        run: |
          docker rm -f cw12a-ci || true

  # 4. Publikacja obrazu, który przeszedł test
  publish:
    name: Opublikuj obraz w Docker Hub
    needs: [prepare, build, test]
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.release.outputs.image_digest }}

    steps:
      - name: Pobierz przetestowany obraz
        uses: actions/download-artifact@v4
        with:
          name: cw12a-weather-image

      - name: Załaduj i sprawdź ID obrazu
        env:
          CI_IMAGE: ${{ needs.prepare.outputs.ci_image }}
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail

          docker load --input image.tar

          LOADED_IMAGE_ID="$(docker image inspect "$CI_IMAGE" --format '{{.Id}}')"

          if [[ "$LOADED_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Obraz do publikacji różni się od obrazu z build."
            exit 1
          fi

      - name: Zaloguj do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Nadaj tagi i opublikuj obraz
        id: release
        env:
          CI_IMAGE: ${{ needs.prepare.outputs.ci_image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHA_TAG: ${{ needs.prepare.outputs.sha_tag }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKER_IMAGE_NAME" ]]; then
            echo "::error::Ustaw zmienne DOCKERHUB_USERNAME i DOCKER_IMAGE_NAME."
            exit 1
          fi

          IMAGE_BASE="${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}"
          STUDENT_IMAGE="${IMAGE_BASE}:${IMAGE_TAG}"
          SHA_IMAGE="${IMAGE_BASE}:${SHA_TAG}"

          docker tag "$CI_IMAGE" "$STUDENT_IMAGE"
          docker tag "$CI_IMAGE" "$SHA_IMAGE"

          docker push "$STUDENT_IMAGE" | tee student-push.log
          docker push "$SHA_IMAGE" | tee sha-push.log

          STUDENT_DIGEST="$(
            sed -nE \
              's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
              student-push.log | tail -n 1
          )"

          SHA_DIGEST="$(
            sed -nE \
              's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
              sha-push.log | tail -n 1
          )"

          if [[ ! "$STUDENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Nie udało się odczytać digestu obrazu."
            exit 1
          fi

          if [[ "$STUDENT_DIGEST" != "$SHA_DIGEST" ]]; then
            echo "::error::Digesty opublikowanych tagów są różne."
            exit 1
          fi

          echo "image_digest=$STUDENT_DIGEST" >> "$GITHUB_OUTPUT"

  # 5. Pobranie opublikowanego obrazu i wdrożenie
  deploy:
    name: Wdróż i sprawdź aplikację
    needs: [prepare, publish]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels) }}

    concurrency:
      group: cw12a-deploy-${{ needs.prepare.outputs.container_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Przygotuj osobną konfigurację Docker
        run: |
          set -euo pipefail

          CONFIG_DIR="$(mktemp -d "${RUNNER_TEMP}/cw12a-docker.XXXXXXXX")"
          chmod 700 "$CONFIG_DIR"

          echo "DOCKER_CONFIG=$CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Zaloguj do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pobierz opublikowany obraz
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Nieprawidłowy digest obrazu."
            exit 1
          fi

          IMAGE_REF="${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}@${IMAGE_DIGEST}"

          docker pull "$IMAGE_REF"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Uruchom kontener docelowy
        env:
          CONTAINER_NAME: ${{ needs.prepare.outputs.container_name }}
          STUDENT_SLUG: ${{ needs.prepare.outputs.student_slug }}
          TARGET: ${{ needs.prepare.outputs.deployment_target }}
          APP_PORT: ${{ needs.prepare.outputs.app_port }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$OPENWEATHER_API_KEY" ]]; then
            echo "::error::Brak sekretu OPENWEATHER_API_KEY."
            exit 1
          fi

          # Usuwamy wyłącznie kontener o nazwie wyznaczonej dla tego wdrożenia.
          if docker container inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
            OWNER="$(
              docker inspect \
                --format '{{ index .Config.Labels "cw12a.repository" }}' \
                "$CONTAINER_NAME"
            )"

            if [[ "$OWNER" != "$GITHUB_REPOSITORY_ID" ]]; then
              echo "::error::Kontener o tej nazwie nie należy do tego repozytorium."
              exit 1
            fi

            docker rm -f "$CONTAINER_NAME"
          fi

          if [[ "$TARGET" == "self-hosted" ]]; then
            PORT_MAPPING="${APP_PORT}:8080"
            RESTART_POLICY="unless-stopped"
          else
            PORT_MAPPING="127.0.0.1:${APP_PORT}:8080"
            RESTART_POLICY="no"
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --label "cw12a.repository=$GITHUB_REPOSITORY_ID" \
            --label "cw12a.student=$STUDENT_SLUG" \
            --restart "$RESTART_POLICY" \
            -p "$PORT_MAPPING" \
            -e OPENWEATHER_API_KEY \
            "$IMAGE_REF"

      - name: Sprawdź gotowość wdrożenia
        id: ready
        env:
          CONTAINER_NAME: ${{ needs.prepare.outputs.container_name }}
          APP_PORT: ${{ needs.prepare.outputs.app_port }}
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:${APP_PORT}"

          for attempt in {1..30}; do
            if curl --fail --silent "${BASE_URL}/healthz" > /dev/null; then
              RUNNING="$(
                docker inspect \
                  --format '{{.State.Running}}' \
                  "$CONTAINER_NAME"
              )"

              if [[ "$RUNNING" != "true" ]]; then
                echo "::error::Kontener nie jest uruchomiony."
                exit 1
              fi

              echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 2
          done

          echo "::error::Wdrożona aplikacja nie jest gotowa."
          exit 1

      - name: Sprawdź wdrożone WWW i API
        env:
          BASE_URL: ${{ steps.ready.outputs.base_url }}
          CITY: ${{ needs.prepare.outputs.weather_city }}
        run: |
          set -euo pipefail

          python3 \
            CWICZENIA/12A-Cwiczenia-pipeline-gha/pogoda_python_flusk/tests/smoke_test.py \
            --base-url "$BASE_URL" \
            --city "$CITY"

      - name: Zapisz podsumowanie
        env:
          BASE_URL: ${{ steps.ready.outputs.base_url }}
          TARGET: ${{ needs.prepare.outputs.deployment_target }}
          APP_PORT: ${{ needs.prepare.outputs.app_port }}
          CONTAINER_NAME: ${{ needs.prepare.outputs.container_name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          {
            echo "## Wynik wdrożenia aplikacji pogodowej"
            echo
            echo "- Test WWW i API: zakończony poprawnie"
            echo "- Cel wdrożenia: $TARGET"
            echo "- Kontener: $CONTAINER_NAME"
            echo "- Digest obrazu: $IMAGE_DIGEST"
            echo "- Adres użyty przez test: $BASE_URL"
            echo

            if [[ "$TARGET" == "self-hosted" ]]; then
              echo "Aplikacja pozostaje uruchomiona na hoście runnera."
              echo "Adres: http://<adres-hosta-runnera>:${APP_PORT}/"
            else
              echo "Runner GitHuba służy tylko do tymczasowego testu."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pokaż logi przy błędzie
        if: failure()
        env:
          CONTAINER_NAME: ${{ needs.prepare.outputs.container_name }}
        run: |
          docker logs "$CONTAINER_NAME" || true

      - name: Usuń tymczasowy kontener GitHuba
        if: always() && needs.prepare.outputs.deployment_target == 'github'
        env:
          CONTAINER_NAME: ${{ needs.prepare.outputs.container_name }}
        run: |
          docker rm -f "$CONTAINER_NAME" || true

      - name: Usuń tymczasową konfigurację logowania
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            docker logout || true

            case "$DOCKER_CONFIG" in
              "$RUNNER_TEMP"/cw12a-docker.*)
                rm -rf -- "$DOCKER_CONFIG"
                ;;
              *)
                echo "Pominięto usunięcie nieznanej konfiguracji Docker."
                ;;
            esac
          fi